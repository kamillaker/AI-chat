<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Chat UI</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="flex">
    <div class="bg-gray-30 w-80 h-screen">
      <button class="p-2 w-full h-20 mb-4 bg-gray-700 text-gray-300">+ New chat</button>
      <div class="block rounded-lg bg-gray-200 p-2 my-1">Chat 1</div>
      <div class="p-2 my-1">Chat 2</div>
    </div>
   <div class="h-screen w-screen flex flex-col">
  <div class="flex-1 bg-gray-100 p-4 flex flex-col gap-2 overflow-y-auto">
  <div class="self-start bg-white text-gray-800 p-2 rounded-lg shadow max-w-xs">
    Hello! How can I help you today?
  </div>
  <div class="self-end bg-blue-400 text-white p-2 rounded-lg shadow max-w-xs">
    <kamilla-msg></kamilla-msg>
  </div>
  <div class="self-start bg-white text-gray-800 p-2 rounded-lg shadow max-w-xs">
    Sure! You can design it using Tailwind flex layouts and spacing.
  </div>
</div>
  <div class="flex p-4 bg-gray-200 pb-8">
    <input
      type="text"
      id="message-input"
      placeholder="Type your message..."
      class="flex-1 p-2 border rounded"
    />
    <button id="send-btn" class="ml-2 px-4 bg-blue-500 text-white rounded">
      Send
    </button>
  </div>
</div>
    <script src="app.js"></script>
  </body>
</html>
